<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b0d" />
  <title>Kit Ranker — World Cup 2026</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="topbar">
    <a href="/" class="brand">KIT<span>·</span>RANKER</a>
    <nav>
      <a href="/leaderboard">Leaderboard</a>
      <a href="/about">About</a>
      <button id="theme-toggle" aria-label="Toggle theme">
        <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </nav>
  </header>

  <main class="vote">
    <p class="prompt">Which kit do you prefer?</p>

    <div class="arena" id="arena">
      <button class="card" data-side="left" disabled>
        <span class="kbd" aria-hidden="true">←</span>
        <div class="card-image"><img alt="" /></div>
        <div class="card-meta">
          <span class="country"></span>
          <span class="kit-type"></span>
        </div>
      </button>

      <div class="vs"><span>vs</span></div>

      <button class="card" data-side="right" disabled>
        <span class="kbd" aria-hidden="true">→</span>
        <div class="card-image"><img alt="" /></div>
        <div class="card-meta">
          <span class="country"></span>
          <span class="kit-type"></span>
        </div>
      </button>
    </div>

    <p class="hint">
      <span class="hint-desktop">Use <kbd>←</kbd> <kbd>→</kbd> to vote · <kbd>space</kbd> to skip</span>
      <span class="hint-mobile">Tap a jersey to vote · <a href="#" id="skip">skip</a></span>
    </p>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
